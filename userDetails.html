<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Пользователь</title>
    <link href="web/css/bootstrap.min.css" rel="stylesheet">
    <script src="web/js/bootstrap.bundle.min.js" defer></script>
    <script src="/web/js/vue.global.js"></script>
    <script src="web/js/footer_header.js"></script>
    <script src="web/js/usersList.js"></script>
    <script src="web/js/carList.js"></script>
    <script src="web/js/userDetails.js" defer></script>

    <link rel="stylesheet" href="web/css/font.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body class="container">
    <div id="app" class="position-relative">
        <div role="button" class="custom-toast btn-dark rounded-2 shadow-sm p-3 position-fixed bottom-0 end-0 me-2 mb-2"
            v-if="isToast" @click="isToast=false">{{ toastText }}</div>
        <main class="mt-3">
            <!-- первый ряд -->
            <div class="row g-3">
                <div class="col-12 col-md-4 rounded-2">
                    <div class="img-wrapper position-relative rounded-2">
                        <div role="button"
                            class="btn-dark rounded-2 shadow-sm p-2 position-absolute bottom-0 end-0 me-2 mb-2"
                            v-if="user.status === 'blocked'">Заблокирован</div>
                        <img :src="user.photo ? '/web/userPhoto/' + user.photo : '/web/userPhoto/base.svg'"
                            class="card-img-top-custom" :class="{ 'base-img': !user.photo }"
                            :alt="'Фото пользователя: ' + user.fullName">
                    </div>
                </div>
                <div class="col-12 col-md-8 rounded-2">
                    <div class="bg-grey p-1 px-2 rounded-2">
                        <form @submit.prevent="updateUser('Данные пользователя обновлены')">
                            <input type="text" class="mt-2 form-control col-12 col-lg-6 rounded-2" placeholder="ФИО"
                                v-model="user.fullName">
                            <input type="text" class="mt-2 form-control col-12 col-lg-6 rounded-2" placeholder="Телефон"
                                v-model="user.phone">
                            <input type="text" class="mt-2 form-control col-12 col-lg-6 rounded-2" placeholder="Почта"
                                v-model="user.email">
                            <div class="row mt-1 g-2">
                                <div class="col-6">
                                    <select class="form-select rounded-2" aria-label="Пол" v-model="user.gender">
                                        <option selected value="Женский">Женский</option>
                                        <option value="Мужской">Мужской</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <input type="text" class="form-control col-12 col-lg-6 rounded-2"
                                        placeholder="Возраст" v-model="user.age">
                                </div>
                            </div>
                            <button type="submit" class="mt-2 mb-2 rounded-2 btn btn-dark w-100">Изменить</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Второй ряд -->

            <div class="row row-cols-1 row-cols-md-2 mt-1 g-3">
                <div class="col" v-if="user.status == 'active'"><button class="btn btn-dark p-3 w-100"
                        @click="toggleStatus(user.id); showToast('Пользователь заблокирован')">Заблокировать</button>
                </div>
                <div class="col" v-else><button class="btn btn-dark p-3 w-100"
                        @click="toggleStatus(user.id); showToast('Пользователь разблокирован')">Разблокировать</button>
                </div>
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="deleteUser()">Удалить</button></div>
            </div>

            <!-- Третий ряд -->

            <div class="bg-grey d-flex justify-content-center align-items-center mt-3 p-3 rounded-2">
                <h2 class="fs-4 mb-0">Объявления пользователя</h2>
            </div>

            <div class="row g-2 row-cols-1 row-cols-md-2 row-cols-xl-3 mt-3">
                <div class="col" v-for="(car, index) in user.cars" v-if="user.cars.length > 0">
                    <div class="card rounded-2 shadow h-100">
                        <div class="card-img-wrapper position-relative ratio ratio-16x9">
                            <div :id="'carousel-' + car.id" class="carousel slide" data-bs-ride="carousel">
                                <div class="carousel-inner">
                                    <div v-for="(img, imgIndex) in car.images"
                                        :class="['carousel-item', { 'active': imgIndex === 0 }]">
                                        <img :src="img ? '/web/carPhoto/' + img : '/web/userPhoto/base.svg'"
                                            class="card-img-top-custom object-fit-cover w-100"
                                            :class="{ 'base-img': !img }" :alt="'Фото машины: ' + car.title">
                                    </div>
                                </div>

                                <div v-if="car.images && car.images.length > 1">
                                    <button class="carousel-control-prev" type="button"
                                        :data-bs-target="'#carousel-' + car.id" data-bs-slide="prev">
                                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Предыдущий</span>
                                    </button>
                                    <button class="carousel-control-next" type="button"
                                        :data-bs-target="'#carousel-' + car.id" data-bs-slide="next">
                                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                        <span class="visually-hidden">Следующий</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <h5 class="card-title fs-4 fw-bold text-center">{{ car.title }}</h5>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ car.price }} ₽
                            </p>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ car.mileage }} КМ
                            </p>
                            <a :href="'carDetails.html?id=' + car.id"
                                class="btn btn-dark rounded-2 d-flex justify-content-center">Подробнее</a>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-5 d-flex vw-100 justify-content-center align-items-center fs-4 fw-bold"
                    v-else>
                    <h2>Нет объявлений</h2>
                </div>
            </div>
        </main>
    </div>
    <script src="/web/js/jquery-4.0.0.min.js"></script>
    <script defer src="/web/js/theme.js"></script>
</body>

</html>
