<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Объявление</title>
    <link href="web/css/bootstrap.min.css" rel="stylesheet">
    <script src="web/js/bootstrap.bundle.min.js" defer></script>
    <script src="web/js/vue.global.js"></script>
    <script src="web/js/footer_header.js" defer></script>
    <script src="web/js/usersList.js"></script>
    <script src="web/js/carList.js"></script>
    <script src="web/js/carDetails.js" defer></script>

    <link rel="stylesheet" href="web/css/font.css">

</head>

<body class="container">
    <div id="app">
        <div role="button" class="custom-toast btn-dark rounded-2 shadow-sm p-3 position-fixed bottom-0 end-0 me-2 mb-2"
            v-if="isToast" @click="isToast=false">{{ toastText }}</div>
        <main>

            <div id="carouselExample" class="carousel slide mt-2">
                <div role="button"
                    class="btn-dark rounded-2 shadow-sm p-2 position-absolute top-0 end-0 me-2 mt-2 is-blocked"
                    v-if="car.status === 'blocked'">Заблокирован</div>
                <div class="carousel-inner">
                    <div class="carousel-item" v-for="(image, index) in car.images" :class="{'active': index == 0}">
                        <img :src="'/web/carPhoto' + image" class="d-block w-100"
                            :alt="'Изображение машины:' + car.title">
                    </div>
                </div>
                <div v-if="car.images && car.images.length > 1">
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 mt-1 g-3">
                <div class="col" v-if="car.status == 'active'"><button class="btn btn-dark p-3 w-100"
                        @click="toggleStatus(car.id); showToast('Объявление заблокировано')">Заблокировать</button>
                </div>
                <div class="col" v-else><button class="btn btn-dark p-3 w-100"
                        @click="toggleStatus(car.id); showToast('Объявление разблокировано')">Разблокировать</button>
                </div>
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="deleteCar(); ">Удалить</button></div>
            </div>

            <div class="col-12 rounded-2 mt-2">
                <div class="bg-grey p-1 px-2 pt-2 rounded-2">
                    <form @submit.prevent="updateCar(); showToast('Данные изменены')">
                        <div class="row g-2 mt-">
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Название"
                                    v-model="car.title">
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Цена"
                                    v-model="car.price">
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Пробег"
                                    v-model="car.mileage">
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Год" v-model="car.year">
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Количество владельцев"
                                    v-model="car.ownersCount">
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" class="form-control rounded-2" placeholder="Цвет"
                                    v-model="car.color">
                            </div>
                            <div class="col-12">
                                <input type="text" class="form-control rounded-2" placeholder="Двигатель"
                                    v-model="car.engine">
                            </div>
                            <div class="col-12 col-md-6">
                                <select class="form-select rounded-2" v-model="car.gearbox">
                                    <option value="Роботизированная">Роботизированная</option>
                                    <option value="Автоматическая">Автоматическая</option>
                                    <option value="Механическая">Механическая</option>
                                    <option value="Вариатор">Вариатор</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <select class="form-select rounded-2" v-model="car.driveShaft">
                                    <option value="Полный">Полный</option>
                                    <option value="Задний">Задний</option>
                                    <option value="Передний">Передний</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="mt-2 mb-1 rounded-2 btn btn-dark w-100">Изменить</button>
                    </form>
                </div>
            </div>

            <a :href="'userDetails.html?id=' + car.userId" class="btn btn-dark mt-2 w-100 p-3">Перейти к
                пользователю: {{ user }}</a>
        </main>
    </div>
    <script src="web/js/jquery-4.0.0.min.js"></script>
    <script defer src="web/js/theme.js"></script>

</body>

</html>
