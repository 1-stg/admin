<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная статистика пользователей</title>
    <link href="web/css/bootstrap.min.css" rel="stylesheet">
    <script src="web/js/bootstrap.bundle.min.js" defer></script>
    <script src="web/js/vue.global.js"></script>
    <script src="web/js/footer_header.js"></script>
    <link rel="stylesheet" href="web/css/font.css">
    <link rel="stylesheet" href="web/css/base.css">
    <script src="web/js/chart.js" defer></script>
    <link rel="stylesheet" href="web/css/chart.css">
</head>

<body class="container" data-bs-theme="light">
    <div id="app">
        <main>
            <div class="row">
                <div class="col-12">
                    <div class="row g-2 bg-grey pt-2 px-3 pb-3 mt-4 rounded-2">
                        <div class="bg-white rounded-2 d-flex justify-content-center align-items-center p-2 mb-2">
                            <h2 class="fs-4 m-0">Статистика пользователей</h2>
                        </div>
                        <div class="chart-scroll-wrapper">
                            <div class="chart-bars-container">
                                <div class="chart-bar-item" v-for="(num, index) in usersCount" :key="index">
                                    <div class="chart-bar-graph"
                                        :style="{ height: getBarHeight(num) + 'px', minHeight: '30px', width: '100%' }">
                                        <div class="bar-inner"
                                            :style="{ height: getInnerHeight(num) + '%', minHeight: '4px' }"></div>
                                    </div>
                                    <div class="bg-white d-flex flex-column p-2 rounded-2 mt-2 w-100 text-center">
                                        <h2 class="fs-6 m-0 text-secondary">{{ months[index] }}</h2>
                                        <h2 class="fs-6 m-0">+ {{ formatNumber(num) }}</h2>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h2 class="fs-3 bg-white p-2 rounded-2 text-center mt-2 m-0">За {{ new Date().getFullYear() }}
                        </h2>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row g-2 bg-grey pt-2 px-3 pb-3 mt-4 rounded-2">
                        <div class="bg-white rounded-2 d-flex justify-content-center align-items-center p-2 mb-2">
                            <h2 class="fs-4 m-0">Статистика пользователей</h2>
                        </div>
                        <div class="chart-scroll-wrapper">
                            <div class="chart-bars-container">
                                <div class="chart-bar-item" v-for="(num, index) in usersCount" :key="index">
                                    <div class="chart-bar-graph"
                                        :style="{ height: getBarHeight(num) + 'px', minHeight: '30px', width: '100%' }">
                                        <div class="bar-inner"
                                            :style="{ height: getInnerHeight(num) + '%', minHeight: '4px' }"></div>
                                    </div>
                                    <div class="bg-white d-flex flex-column p-2 rounded-2 mt-2 w-100 text-center">
                                        <h2 class="fs-6 m-0 text-secondary">{{ months[index] }}</h2>
                                        <h2 class="fs-6 m-0">+ {{ formatNumber(num) }}</h2>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <h2 class="fs-3 bg-white p-2 rounded-2 text-center mt-2 m-0">За {{ new Date().getFullYear() }}
                        </h2>
                    </div>
                </div>
                <div class="col-6"></div>
            </div>
        </main>
    </div>

    <script src="/web/js/jquery-4.0.0.min.js"></script>
    <script defer src="/web/js/theme.js"></script>
</body>

</html>
