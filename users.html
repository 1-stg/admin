<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Пользователи</title>
    <link href="web/css/bootstrap.min.css" rel="stylesheet">
    <script src="web/js/bootstrap.bundle.min.js" defer></script>
    <script src="/web/js/vue.global.js"></script>
    <script src="web/js/footer_header.js"></script>
    <script src="web/js/carList.js"></script>
    <script src="web/js/usersList.js"></script>
    <script src="web/js/users.js" defer></script>
    <script src="web/js/toast.js"></script>

    <link rel="stylesheet" href="web/css/font.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body class="container" data-bs-theme="light">
    <div id="app">
        <main>
            <div role="button"
                class="custom-toast btn-dark rounded-2 shadow-sm p-3 w-50 position-fixed bottom-0 end-0 me-2 mb-2"
                v-if="isToast" @click="isToast=false">{{ toastText }}</div>
            <!-- Поиск -->
            <div class="mt-2 row row-cols-1 row-cols-md-2 g-3">
                <div class="col">
                    <form role="search">
                        <div class="input-group">
                            <input type="search" class="form-control rounded-2 p-3" name="search" placeholder="Поиск..."
                                aria-label="Search" v-model="searchText" @input="search()">
                        </div>
                    </form>
                </div>
                <div class="col">
                    <button type="button" class="btn h-100 btn-dark rounded-2 w-100">Найдено {{ users.length }}
                        пользователей</button>
                </div>
            </div>

            <!-- Пользователи -->
            <div v-if="users == []" class="col-12 mt-3">
                <h2 class="fs-4 fw-normal text-center">По результатам поиска ничего не найдено</h2>
            </div>

            <div class=" row row-cols-1 row-cols-md-2 row-cols-xl-3 mt-4 pb-2 rounded-2 g-2">
                <div class="col" v-for="(user) in users">
                    <div class="card rounded-2 shadow h-100">
                        <!-- Обертка для фото с фиксированной высотой -->
                        <div class="card-img-wrapper">
                            <img :src="user.photo ? '/web/userPhoto/' + user.photo : '/web/userPhoto/base.svg'"
                                class="card-img-top-custom" :class="{ 'base-img': !user.photo }"
                                :alt="'Фото пользователя: ' + user.fullName">
                        </div>

                        <div class="card-body">
                            <h5 class="card-title fs-4 fw-bold text-center">{{ user.fullName }}</h5>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ user.phone }}
                            </p>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ user.email }}
                            </p>
                            <a :href="'userDetails.html?id=' + user.id"
                                class="btn btn-dark rounded-2 d-flex justify-content-center">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row row-cols-1 row-cols-md-2 mt-2 g-2">
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="loadDataFromLocalstorage()">Загрузить
                        пользователей</button></div>
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="clearData()">Очистить
                        данные</button></div>
            </div>
        </main>
    </div>
    <script src="/web/js/jquery-4.0.0.min.js"></script>
    <script defer src="/web/js/theme.js"></script>
</body>

</html>
