<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="web/js/users.js" defer></script>
    <link rel="stylesheet" href="web/css/base.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body class="container" data-bs-theme="light">
    <div id="app">
        <header class="shadow p-2 rounded-4 mt-3">
            <nav class="row mx-1">
                <li class="col-6 d-flex  align-items-center justify-content-start">
                    <a class="d-flex gap-1 text-decoration-none" href="index.html"><img src="web/assets/logo.svg"
                            alt="логотип" class="header_img">
                        <button class="btn p-0 mb-0">Админ</button>
                    </a>
                </li>
                <div class="col-6 d-flex justify-content-end">
                    <a href="#" class="d-flex justify-content-end"><img src="web/assets/blank.svg" alt="Объявления"
                            class="w-75">
                    </a>
                    <a href="users.html" class="d-flex justify-content-end"><img src="web/assets/user.svg"
                            alt="Объявления" class="w-75">
                    </a>
                </div>
            </nav>
        </header>


        <main>
            <!-- Поиск -->
            <div class="mt-2 row row-cols-1 row-cols-md-2 g-3">
                <div class="col">
                    <form role="search">
                        <div class="input-group">
                            <input type="search" class="form-control rounded-4 p-3" name="search" placeholder="Поиск..."
                                aria-label="Search" v-model="searchText" @input="search()">
                        </div>
                    </form>
                </div>
                <div class="col">
                    <button type="button" class="btn h-100 btn-dark rounded-4 w-100">Фильтры</button>
                </div>
            </div>

            <!-- Пользователи -->
            <div v-if="users.length === 0" class="col-12 mt-3">
                <h2 class="fs-4 fw-normal text-center">По результатам поиска ничего не найдено</h2>
            </div>
            <div class="bg-grey row row-cols-1 row-cols-md-2 row-cols-xl-3 mt-4 pb-2 rounded-4 g-2">
                <div class="col" v-for="(user) in users">
                    <div class="card rounded-4 shadow h-100">
                        <!-- Обертка для фото с фиксированной высотой -->
                        <div class="card-img-wrapper">
                            <img :src="user.photo ? '/web/userPhoto/' + user.photo : '/web/userPhoto/base.svg'"
                                class="card-img-top-custom" :class="{ 'base-img': !user.photo }"
                                :alt="'Фото пользователя: ' + user.fullName">
                        </div>

                        <div class="card-body">
                            <h5 class="card-title fs-4 fw-bold text-center">{{ user.fullName }}</h5>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ user.phone }}
                            </p>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ user.email }}
                            </p>
                            <a :href="'userDetails.html?id=' + user.id"
                                class="btn btn-dark rounded-4 d-flex justify-content-center">Подробнее</a>
                        </div>
                    </div>
                </div>
        </main>

        <footer class="mt-3 rounded-top-4 p-3 bg-black shadow d-flex justify-content-center align-items-center">
            2026 &copy;
        </footer>
    </div>
</body>

</html>
