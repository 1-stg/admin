<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Объявления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="web/js/footer_header.js"></script>
    <script src="web/js/usersList.js"></script>
    <script src="web/js/carList.js"></script>
    <script src="web/js/cars.js" defer></script>
    <link rel="stylesheet" href="web/css/base.css">
    <link rel="stylesheet" href="web/css/font.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body class="container">
    <div id="app">
        <main>
            <!-- Поиск -->
            <div class="mt-2 row row-cols-1 row-cols-md-2 g-3">
                <div class="col">
                    <form role="search">
                        <div class="input-group">
                            <input type="search" class="form-control rounded-2 p-3" name="search" placeholder="Поиск..."
                                aria-label="Search" v-model="searchText" @input="search()">
                        </div>
                    </form>
                </div>
                <div class="col">
                    <button type="button" class="btn h-100 btn-dark rounded-2 w-100">Найдено {{ cars.length }}
                        пользователей</button>
                </div>
            </div>

            <!-- Пользователи -->
            <div v-if="cars == []" class="col-12 mt-3">
                <h2 class="fs-4 fw-normal text-center">По результатам поиска ничего не найдено</h2>
            </div>

            <div class="row g-2 row-cols-1 row-cols-md-2 row-cols-xl-3 mt-3">
                <div class="col" v-for="(car, index) in cars">
                    <div class="card rounded-2 shadow h-100">
                        <div class="card-img-wrapper position-relative ratio ratio-16x9">
                            <img :src="car.images.length > 0 ? '/web/carPhoto/' + car.images[car.activeImage] : '/web/userPhoto/base.svg'"
                                class="card-img-top-custom object-fit-cover"
                                :class="{ 'base-img': !car.images[car.activeImage] }"
                                :alt="'Фото машины: ' + car.title">
                            <div v-if="car.images.length > 1">
                                <button type="button" class="btn bg-white shadow position-absolute top-50 end-0 me-3 "
                                    @click="nextImage(index) ">></button>
                                <button type="button" class="btn bg-white shadow position-absolute top-50 start-0 ms-3"
                                    @click="prevImage(index)">
                                    <</button>
                            </div>
                        </div>

                        <div class="card-body">
                            <h5 class="card-title fs-4 fw-bold text-center">{{ car.title }}</h5>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ car.price }} ₽
                            </p>
                            <p class="card-text fs-6 fw-normal text-center">
                                {{ car.mileage }} КМ
                            </p>
                            <a :href="'carDetails.html?id=' + car.id"
                                class="btn btn-dark rounded-2 d-flex justify-content-center">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row row-cols-1 row-cols-md-2 mt-2 g-2">
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="loadDataFromLocalstorage()">Загрузить данные</button></div>
                <div class="col"><button class="btn btn-dark p-3 w-100" @click="clearData()">Очистить
                        данные</button></div>
            </div>
        </main>
    </div>
</body>

</html>
